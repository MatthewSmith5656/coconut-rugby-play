<!doctype html>
<html lang="en">
<head>
    <meta name="robots" content="noindex, nofollow">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102a28">
  <title>Coconut Rugby — Island rugby. Your way.</title>
  <link rel="icon" href="TemplateData/coconut.svg" type="image/svg+xml">
  <link rel="stylesheet" href="TemplateData/coconut.css">
</head>
<body>
  <main id="unity-container">
    <canvas id="unity-canvas" width="1440" height="900" tabindex="0" aria-label="Coconut Rugby game"></canvas>
    <section id="loading" aria-label="Loading Coconut Rugby">
      <img src="TemplateData/coconut.svg" width="64" height="64" alt="">
      <p class="eyebrow">ISLAND RUGBY. YOUR WAY.</p>
      <h1>COCONUT <span>RUGBY</span></h1>
      <progress id="load-progress" max="1" value="0" aria-label="Game loading progress"></progress>
      <p id="load-status" role="status">Getting the pitch ready…</p>
    </section>
    <div id="game-warning" role="alert" hidden></div>
    <div id="speed-note" role="status" hidden><p></p><button type="button" aria-label="Dismiss">OK</button></div>
    <footer id="unity-footer">
      <span class="brand">COCONUT <b>RUGBY</b> · ISLAND RUGBY. YOUR WAY.</span>
      <span id="frame-status" title="Game update frame rate; measured while active">Loading</span>
      <label class="quality-label">Graphics <select id="quality" aria-label="Graphics quality">
        <option value="lowest">Lowest</option><option value="performance">Performance</option><option value="balanced">Balanced</option><option value="sharp">Sharp</option>
      </select></label>
      <button id="fullscreen" type="button" disabled aria-label="Enter fullscreen">⛶ <span>Fullscreen</span></button>
    </footer>
  </main>
  <script src="TemplateData/coconut.js"></script>
</body>
</html>
